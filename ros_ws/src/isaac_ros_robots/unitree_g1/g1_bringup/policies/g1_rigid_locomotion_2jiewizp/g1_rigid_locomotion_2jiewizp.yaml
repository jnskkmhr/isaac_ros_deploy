models:
  IsaacContrib-Push-G1-29dof-Locomotion-Play:
    inputs:
    - name: robot_joint_pos
      dtype: float32
      shape:
      - 1
      - 29
      type: tensor
      kind: state/joint/position
      element_names:
      - &id001
        - left_hip_pitch_joint
        - left_hip_roll_joint
        - left_hip_yaw_joint
        - left_knee_joint
        - left_ankle_pitch_joint
        - left_ankle_roll_joint
        - right_hip_pitch_joint
        - right_hip_roll_joint
        - right_hip_yaw_joint
        - right_knee_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint
        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint
        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint
        - left_wrist_roll_joint
        - left_wrist_pitch_joint
        - left_wrist_yaw_joint
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
      isaaclab_connection: state:robot:joint_pos
    - name: robot_joint_vel
      dtype: float32
      shape:
      - 1
      - 29
      type: tensor
      kind: state/joint/velocity
      element_names:
      - - left_hip_pitch_joint
        - left_hip_roll_joint
        - left_hip_yaw_joint
        - left_knee_joint
        - left_ankle_pitch_joint
        - left_ankle_roll_joint
        - right_hip_pitch_joint
        - right_hip_roll_joint
        - right_hip_yaw_joint
        - right_knee_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint
        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint
        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint
        - left_wrist_roll_joint
        - left_wrist_pitch_joint
        - left_wrist_yaw_joint
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
      isaaclab_connection: state:robot:joint_vel
    - name: last_action_in
      dtype: float32
      shape:
      - 1
      - 15
      type: tensor
    - name: robot_root_ang_vel_b
      dtype: float32
      shape:
      - 1
      - 3
      type: tensor
      kind: state/body/angular_velocity
      element_names:
      - - x
        - y
        - z
      isaaclab_connection: state:robot:root_ang_vel_b
    - name: robot_root_quat_w
      dtype: float32
      shape:
      - 1
      - 4
      type: tensor
      kind: state/body/rotation
      element_names:
      - - qx
        - qy
        - qz
        - qw
      isaaclab_connection: state:robot:root_quat_w
    - name: base_velocity
      dtype: float32
      shape:
      - 1
      - 3
      type: tensor
      kind: command/body/velocity
      element_names:
      - - lin_vel_x
        - lin_vel_y
        - ang_vel_z
      isaaclab_connection: command:base_velocity
    outputs:
    - name: joint_pos
      dtype: float32
      shape:
      - 1
      - 29
      type: tensor
      kind: target/joint/position
      element_names:
      - *id001
      isaaclab_connection: write:robot:set_joint_position_target_index
    - name: last_action_out
      dtype: float32
      shape:
      - 1
      - 15
      type: tensor
    - name: joint_pos_kp_gains
      dtype: float32
      shape:
      - 1
      - 29
      type: tensor
      kind: kp
      element_names:
      - *id001
      isaaclab_connection: write:robot:write_joint_stiffness_to_sim_index
    - name: joint_pos_kd_gains
      dtype: float32
      shape:
      - 1
      - 29
      type: tensor
      kind: kd
      element_names:
      - *id001
      isaaclab_connection: write:robot:write_joint_damping_to_sim_index
    parameters:
      model_path: IsaacContrib-Push-G1-29dof-Locomotion-Play.onnx
      md5sum: 435b9b0efc8b90573a3d0f9355fe63ab
      sha256sum: f51d7729a076aa6bab507b953cad113aa31d03961b0ebdbd93ff6ad2f9035d75
      backend: onnx
      warp_segments: 0
      opset_version: 20
pipeline:
  configs:
    frequency: 50.0
  data_flow: {}
  feedback_flow:
    IsaacContrib-Push-G1-29dof-Locomotion-Play/last_action_out:
    - IsaacContrib-Push-G1-29dof-Locomotion-Play/last_action_in
  initial_values: g1_rigid_locomotion_2jiewizp_initial_values.safetensors
  inputs:
    IsaacContrib-Push-G1-29dof-Locomotion-Play:
    - robot_joint_pos
    - robot_joint_vel
    - robot_root_ang_vel_b
    - robot_root_quat_w
    - base_velocity
  outputs:
    IsaacContrib-Push-G1-29dof-Locomotion-Play:
    - joint_pos
    - joint_pos_kp_gains
    - joint_pos_kd_gains
system information:
  cuda version: '13.0'
  leapp config version: '1.3'
  leapp version: 0.7.2
  os: Ubuntu 24.04
  python version: 3.12.14
  torch version: 2.11.0+cu130
  warp version: 1.19.0.dev20261008
